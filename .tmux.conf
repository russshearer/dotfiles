# ~/.tmux.conf — Sensible defaults for homelab

# ----------------------------------------------------------
# Prefix: Ctrl+a (easier than Ctrl+b)
# ----------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ----------------------------------------------------------
# General
# ----------------------------------------------------------
set -g default-terminal "screen-256color"
set -g history-limit 50000
set -g mouse on
set -g base-index 1              # Windows start at 1
setw -g pane-base-index 1        # Panes start at 1
set -g renumber-windows on       # Renumber on close
set -sg escape-time 10           # Faster escape
set -g focus-events on

# ----------------------------------------------------------
# Splits — intuitive keys
# ----------------------------------------------------------
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window keeps current path
bind c new-window -c "#{pane_current_path}"

# ----------------------------------------------------------
# Pane navigation — vim-style
# ----------------------------------------------------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ----------------------------------------------------------
# Reload config
# ----------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ----------------------------------------------------------
# Status bar
# ----------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=colour235,fg=colour248"
set -g status-left "#[fg=colour46,bold] #S "
set -g status-right "#[fg=colour214]#H #[fg=colour248]| %Y-%m-%d %H:%M "
set -g status-left-length 30
set -g status-right-length 50

# Active window
setw -g window-status-current-style "fg=colour46,bg=colour238,bold"
setw -g window-status-current-format " #I:#W "

# Inactive window
setw -g window-status-style "fg=colour248,bg=colour235"
setw -g window-status-format " #I:#W "

# Pane borders
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour46"
